<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA WEB LOGIN</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://kit.fontawesome.com/4c033a32a0.js" crossorigin="anonymous"></script>
</head>



<body>

<header>
    <h1><i class="fa-solid fa-graduation-cap cwhite"></i> BCA WEB PORTAL Notice<i class="fa-solid fa-book-open"></i></h1>
    <p> Empowering Students,Building Futures.</p>
</header>

   

<div class="formcontainer">

    <h3 class="formtitle"><i class="fa-solid fa-circle-user cblue"></i>Notice</h3>

    <form id="questionform" method="post">


<div class="inputfield">
        <label for="question"><i class="fa-solid fa-user cblue"></i>Notice</label>
        <input required type="text" name="question" id="question" placeholder="Notice">
</div>

<div class="inputfield">
        <label for="difficulty"><i class="fa-solid fa-envelope cblue"></i>Difficulty</label>
        <select name="difficulty" id="difficulty">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>
</div>

<div class="inputfield buttons">
        <button type="submit" class="bgreen" type="submit"><i class="fa-solid fa-user-plus cwhite"></i>Add Notice</button>

        <button class="bblue" type="button" onclick="location.href='/logout'"><i class="fa-solid fa-right-to-bracket cwhite"></i> Lgout</button>
</div>


    </form>

</div>

<div style="margin: 0; min-height: 100vh; background-attachment: fixed; background-image: linear-gradient(120deg, rgb(171, 171, 226), rgb(192, 192, 192)); padding: 20px;">
    <div style="background-color: rgb(255, 255, 255); margin: 50px auto; width: max-content; padding: 20px; border-radius: 20px; border: 2px solid rgb(223, 219, 212);">
        <table style="border-collapse: collapse; width: 100%;">
            <thead>
                <tr>
                    <th style="padding: 10px; border: 1px solid rgb(201, 201, 201);">No.</th>
                    <th style="padding: 10px; border: 1px solid rgb(201, 201, 201);">Date</th>
                    <th style="padding: 10px; border: 1px solid rgb(201, 201, 201);">Notice</th>
                    <th style="padding: 10px; border: 1px solid rgb(201, 201, 201);">Urgency</th>
                </tr>
            </thead>
            <tbody>
                {% for item in questions %}
                    {% if item.id %}
                        <tr>
                            <td style="padding: 10px; border: 1px solid rgb(201, 201, 201);">{{ item.id }}</td>
                            <td style="padding: 10px; border: 1px solid rgb(201, 201, 201);">{{ item.notice_date }}</td>
                            <td style="padding: 10px; border: 1px solid rgb(201, 201, 201);">{{ item.question }}</td>
                            <td style="padding: 10px; border: 1px solid rgb(201, 201, 201);">{{ item.difficulty }}</td>
                        </tr>
                    {% endif %}
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>
    <script src="/static/js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</html>
