<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA WEB LOGIN</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://kit.fontawesome.com/4c033a32a0.js" crossorigin="anonymous"></script>
</head>



<body>

<header>
    <h1><i class="fa-solid fa-graduation-cap cwhite"></i> BCA WEB PORTAL Notice <i class="fa-solid fa-book-open"></i></h1>
    <p> Empowering Students,Building Futures.</p>
</header>
   

<div class="formcontainer">

    <h3 class="formtitle"><i class="fa-solid fa-circle-user cblue"></i> ADMIN LOGIN</h3>
<p class="stitle">Create your account to get start1</p>
    <form id="adminloginform">



<div class="inputfield">
        <label for="email"><i class="fa-solid fa-envelope cblue"></i> Email</label>
        <input type="email" name="email" id="email" placeholder="Emial id">
</div>

<div class="inputfield">
        <label for="password"><i class="fa-solid fa-lock cblue"></i> Password</label>
        <input type="password" name="password" id="password" placeholder="Password">
</div>

<div class="inputfield buttons">

        <button type="submit" class="bblue"><i class="fa-solid fa-right-to-bracket cwhite"></i> LOGIN</button>
        <button class="bgreen" type="button" onclick="location.href='/register'"><i class="fa-solid fa-user-plus cwhite"></i> REGISTER</button>

</div>


    </form>

</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="/static/js/main.js"></script>
    

</body>
</html>
