<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA WEB LOGIN</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://kit.fontawesome.com/4c033a32a0.js" crossorigin="anonymous"></script>
</head>



<body>

<header>
    <h1><i class="fa-solid fa-graduation-cap cwhite"></i> BCA WEB PORTAL <i class="fa-solid fa-book-open"></i></h1>
    <p> Empowering Students,Building Futures.</p>
</header>

   

<div class="formcontainer">

    <h3 class="formtitle"><i class="fa-solid fa-circle-user cblue"></i> STUDENT REGISTERATION</h3>
<p class="stitle">Create your account to get start1</p>

    <form id="regform" method="post">


<div class="inputfield">
        <label for="name"><i class="fa-solid fa-user cblue"></i> Name</label>
        <input required type="text" name="name" id="name" placeholder="Full name">
</div>

<div class="inputfield">
        <label for="email"><i class="fa-solid fa-envelope cblue"></i> Email</label>
        <input required type="email" name="email" id="email" placeholder="Emial id">
</div>

<div class="inputfield">
        <label for="password"><i class="fa-solid fa-lock cblue"></i> Password</label>
        <input  required type="password" name="password" id="password" placeholder="Password">
</div>

<div class="inputfield buttons">
        <button type="submit" class="bgreen" type="submit"><i class="fa-solid fa-user-plus cwhite"></i> REGISTER</button>

        <button class="bblue" type="button" onclick="location.href='/'"><i class="fa-solid fa-right-to-bracket cwhite"></i> LOGIN</button>
</div>


    </form>

</div>

    

</body>
    <script src="/static/js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</html>
